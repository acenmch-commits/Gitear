name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Clean
        run: rm -rf node_modules android

      - name: Prepare Web Dir
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "<h1>Time Tracker</h1>" > www/index.html
          fi

      - name: Install deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set 64-bit only
        run: |
          sed -i "/defaultConfig {/a\\        ndk { abiFilters 'arm64-v8a' }" android/app/build.gradle

      - name: Set version code from run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Sync
        run: npx cap sync android

      - name: Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=timetracker \
            -Pandroid.injected.signing.key.password=123456

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
