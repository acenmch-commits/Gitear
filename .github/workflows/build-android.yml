name: Build Signed Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if www/index.html missing
        run: |
          if [ ! -f www/index.html ]; then
            echo "❌ www/index.html 不存在，请先上传调音器 HTML"
            exit 1
          fi
          echo "✅ www/index.html 存在，大小: $(wc -c < www/index.html) 字节"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure package.json exists
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"guitar-tuner","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.2","@capacitor/core":"^6.1.2"},"devDependencies":{"@capacitor/cli":"^6.1.2"}}' > package.json
          fi
          cat package.json

      - name: Ensure capacitor.config.json exists
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.acenmch.gitear","appName":"吉他调音器","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          fi
          cat capacitor.config.json

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Inject microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permissions = (
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n'
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\\n'
          )
          if "android.permission.RECORD_AUDIO" not in content:
              marker = "    <application"
              if marker not in content:
                  raise SystemExit("无法定位 AndroidManifest.xml 中的 <application>")
              content = content.replace(marker, permissions + "\\n" + marker, 1)
              manifest.write_text(content, encoding="utf-8")
          PY

      # ========== 计算版本号 ==========
      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            MAJOR=${MAJOR:-1}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}"
            VERSION_CODE=${GITHUB_RUN_NUMBER}
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "本次构建版本: versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}"

      # ========== 注入版本号到 build.gradle ==========
      - name: Inject version into build.gradle
        run: |
          GRADLE="android/app/build.gradle"
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      # ========== 解码 keystore ==========
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          ls -la android/release.keystore

      - name: Sync web assets
        run: npx cap sync android

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      # ========== 签名 Release APK ==========
      - name: Build Signed Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/guitar-tuner-v${VERSION_NAME}.apk"
          ls -la out/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitar-tuner-apk
          path: out/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
